spring:
  profiles:
    default: local
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: specnote
    password: specnote
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800      # 30?
  refresh-token-validity-seconds: 1209600  # 14?